name: Python CI

on:
  push:
    branches:
      - Top-Men
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Compile Python sources
        run: python -m compileall -q tg_suite

      - name: Run unit tests
        env:
          PYTHONPATH: tg_suite
        run: python -m unittest discover -s tg_suite/tests -v
